<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mess Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#3a1f14;--muted:#8a6b5c;--line:#f3dcc0;--c1:#ff6a3d;--c2:#ffb627;--leaf:#1fa855;--leafsoft:#e3f8ea;--shadow:rgba(120,55,15,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1411;--card:#2b1d18;--ink:#fff1e4;--muted:#c4a898;--line:#4a3228;--leafsoft:#173a26;--shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#1e1411;--card:#2b1d18;--ink:#fff1e4;--muted:#c4a898;--line:#4a3228;--leafsoft:#173a26;--shadow:rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:600;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:26px 18px 90px;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.top::before{width:220px;height:220px;right:-60px;top:-70px}
.top::after{width:140px;height:140px;left:-40px;bottom:-50px}
.wrap{max-width:560px;margin:0 auto;position:relative}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:2.1rem;margin:0;line-height:1.1}
.date{margin:4px 0 14px;opacity:.92}
.meals{display:flex;gap:8px}
.meals button{flex:1;border:0;border-radius:99px;padding:9px 6px;font:inherit;font-weight:800;color:#fff;background:rgba(255,255,255,.22);cursor:pointer}
.meals button.on{background:#fff;color:var(--c1)}
main{max-width:560px;margin:-64px auto 0;padding:0 14px;position:relative}
.stat{background:var(--card);border-radius:26px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 14px 30px var(--shadow);margin-bottom:18px}
.ring{--p:0;width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
background:conic-gradient(var(--leaf) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
.ring b,.ring span{position:relative}
.ring b{font-family:"Baloo 2",sans-serif;font-size:2.4rem;line-height:1;font-weight:800}
.ring span{font-size:.75rem;color:var(--muted);font-weight:800}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.say h2{font-family:"Baloo 2",sans-serif;font-size:1.35rem;margin:0;line-height:1.15}
.say p{margin:4px 0 0;color:var(--muted)}
.search{position:relative;margin:0 0 16px}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none}
.search input{appearance:none;-webkit-appearance:none;width:100%;height:52px;border-radius:99px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;padding:0 46px 0 46px;box-shadow:0 5px 14px var(--shadow);display:block;order:0}
.search input::after{display:none}
.search input:focus{outline:none;border-color:var(--c1)}
.search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:1rem;cursor:pointer;padding:0}
.none{text-align:center;color:var(--muted);padding:24px 0;margin:0}
.hd{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.hd h3{margin:0;font-family:"Baloo 2",sans-serif;font-size:1.2rem}
.hd button{border:0;background:none;color:var(--c1);font:inherit;font-weight:800;cursor:pointer;padding:6px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
label{display:flex;align-items:center;gap:13px;padding:11px 14px 11px 11px;background:var(--card);border:2.5px solid transparent;border-radius:22px;box-shadow:0 5px 14px var(--shadow);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
label:active{transform:scale(.97)}
label:has(input:checked){border-color:var(--leaf);background:var(--leafsoft)}
.av{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-content:center;font-size:1.5rem;color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:1.05rem;font-weight:800}
.nm small{color:var(--muted);font-weight:700}
input:checked ~ .nm small{color:var(--leaf)}
input{appearance:none;-webkit-appearance:none;order:3;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);margin:0;flex:none;display:grid;place-content:center;cursor:pointer;background:var(--card);transition:background .15s,border-color .15s}
input::after{content:"";width:9px;height:16px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
input:checked{background:var(--leaf);border-color:var(--leaf)}
input:checked::after{transform:rotate(45deg) scale(1)}
input:focus-visible,button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.bar div{max-width:560px;margin:0 auto;background:#2b1710;color:#fff;border-radius:22px;padding:13px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.bar .e{font-size:1.9rem}
.bar strong{display:block;font-family:"Baloo 2",sans-serif;font-size:1.3rem;line-height:1.1}
.bar span{font-size:.85rem;opacity:.8}
.menu{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 14px 30px var(--shadow);margin-bottom:18px}
.menu h3{margin:0;font-family:"Baloo 2",sans-serif;font-size:1.2rem}
.days{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.days button{flex:none;border:0;border-radius:99px;padding:7px 13px;font:inherit;font-weight:800;background:var(--line);color:var(--ink);cursor:pointer}
.days button.on{background:var(--c1);color:#fff}
.days button.today::after{content:" •"}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:2px solid transparent;margin-top:6px}
.mrow.cur{border-color:var(--c1);background:var(--bg)}
.mrow .me{font-size:1.5rem;line-height:1.2}
.mrow b{display:block;font-weight:800}
.mrow small{color:var(--muted);font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <h1>Who’s eating today? 🍛</h1>
  <p class="date" id="date"></p>
  <div class="meals" id="meals">
    <button data-m="Breakfast" data-e="🥞">🥞 Breakfast</button>
    <button data-m="Lunch" data-e="🍛" class="on">🍛 Lunch</button>
    <button data-m="Dinner" data-e="🍚">🍚 Dinner</button>
  </div>
</div></div>
<main>
  <section class="stat" aria-live="polite">
    <div class="ring" id="ring"><b id="count">0</b><span id="of">of 10</span></div>
    <div class="say"><h2 id="mood">Waiting for the first student</h2><p id="sub">Tap a name to mark present</p></div>
  </section>
  <section class="menu"><h3>🍽️ Weekly Menu</h3><div class="days" id="days"></div><div id="mrows"></div></section>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Search student name…" aria-label="Search student by name" autocomplete="off"><button id="qx" hidden aria-label="Clear search">✕</button></div>
  <div class="hd"><h3>Students</h3><span><button id="all">Select all</button><button id="clear">Clear</button></span></div>
  <ul id="list"></ul>
  <p class="none" id="none" hidden>No student found. Check the spelling.</p>
</main>
<div class="bar"><div><span class="e" id="emoji">🍛</span><p style="margin:0"><strong id="prep">Prepare 0 plates</strong><span id="serve">Serve food for 0 students</span></p></div></div>
<script>
var students=["Aarav Sharma","Priya Verma","Rohan Gupta","Ananya Singh","Mohammed Faizan","Neha Yadav","Kabir Mishra","Sana Khan","Vikram Tiwari","Isha Srivastava"];
var colors=["#ff6a3d","#1fa855","#e29a0d","#7b5cd6","#1e8fb5","#d6457f","#8aa31a","#c4552b","#3d7be0","#b0408f"];
var list=document.getElementById("list");
students.forEach(function(s,i){
  var li=document.createElement("li");
  li.innerHTML='<label><span class="av" style="background:'+colors[i]+'">'+s.charAt(0)+'</span><span class="nm"><b>'+s+'</b><small>Not here yet</small></span><input type="checkbox" aria-label="'+s+' is present"></label>';
  list.appendChild(li);
});
var boxes=list.querySelectorAll("input"),last=-1;
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
function $(i){return document.getElementById(i)}
function update(){
  var n=0,t=boxes.length;
  boxes.forEach(function(b){
    if(b.checked)n++;
    b.parentNode.querySelector("small").textContent=b.checked?"Present ✓":"Not here yet";
  });
  $("count").textContent=n;
  $("of").textContent="of "+t;
  $("ring").style.setProperty("--p",n/t*100);
  $("mood").textContent=n===0?"Waiting for the first student":n===t?"Full house! 🎉":n>=t/2?"Filling up nicely":"Tables are warming up";
  $("sub").textContent=n===0?"Tap a name to mark present":(t-n)+" still to arrive";
  $("prep").textContent="Prepare "+n+(n===1?" plate":" plates");
  $("serve").textContent="Serve food for "+n+(n===1?" student":" students");
  if(n!==last){var c=$("count");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");last=n}
}
boxes.forEach(function(b){b.addEventListener("change",update)});
var items=list.querySelectorAll("li");
function filter(){
  var q=$("q").value.trim().toLowerCase(),shown=0;
  items.forEach(function(li,i){
    var ok=students[i].toLowerCase().indexOf(q)>-1;
    li.hidden=!ok;if(ok)shown++;
  });
  $("none").hidden=shown>0;
  $("qx").hidden=!q;
}
$("q").addEventListener("input",filter);
$("qx").onclick=function(){$("q").value="";filter();$("q").focus()};
$("all").onclick=function(){boxes.forEach(function(b){b.checked=true});update()};
$("clear").onclick=function(){boxes.forEach(function(b){b.checked=false});update()};
$("meals").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  this.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on");$("emoji").textContent=b.dataset.e;renderMenu();
});
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var POOL={
 Breakfast:["Poha & Chai","Idli Sambar","Aloo Paratha & Curd","Upma & Banana","Puri Sabzi"],
 Lunch:["Dal Tadka & Rice","Rajma Rice","Chole Rice","Kadhi Rice","Mix Veg & Roti"],
 Dinner:["Paneer Masala & Roti","Dal Fry & Roti","Veg Biryani & Raita","Khichdi & Papad","Egg Curry & Roti"]
};
var MENU=[0,1,2,3,4,5,6].map(function(i){return [POOL.Breakfast[i%5],POOL.Lunch[(i+2)%5],POOL.Dinner[(2*i+1)%5]]});
var ME={Breakfast:"🥞",Lunch:"🍛",Dinner:"🍚"},MN=["Breakfast","Lunch","Dinner"];
var today=(new Date().getDay()+6)%7,selDay=today;
function renderMenu(){
  var cur=document.querySelector("#meals .on").dataset.m;
  $("days").innerHTML=DAYS.map(function(d,i){return '<button data-d="'+i+'" class="'+(i===selDay?"on ":"")+(i===today?"today":"")+'">'+d+'</button>'}).join("");
  $("mrows").innerHTML=MN.map(function(m,i){return '<div class="mrow'+(m===cur?" cur":"")+'"><span class="me">'+ME[m]+'</span><div><b>'+m+'</b><small>'+MENU[selDay][i]+'</small></div></div>'}).join("");
}
$("days").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;selDay=+b.dataset.d;renderMenu()});
renderMenu();
update();
</script>
</body>
</html>
